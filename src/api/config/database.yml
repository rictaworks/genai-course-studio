default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  connect_timeout: 2
  database: unconfigured_do_not_create
  host: 127.0.0.1
  port: 1

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"].to_json %>
test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"].to_json %>
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"].to_json %>
